<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives — make a puzzle from a picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141a1d; --panel:#1b2326; --line:#34454a; --line-hard:#6a868e;
    --bone:#e9e3d6; --clue:#d2ccbf; --muted:#7a8a90; --dim:#4c5c62; --gold:#e8b54b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--bone);
    font-family:"DM Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:18px 12px 40px;
  }
  .wrap{width:100%;max-width:760px}
  h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
  a{color:var(--gold)}
  .tag{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .drop{
    display:block;line-height:1.7;border:1px dashed var(--line-hard);background:var(--panel);padding:22px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;
  }
  .drop.over{border-color:var(--gold);color:var(--bone)}
  .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0;font-size:13px;color:var(--clue)}
  .controls label{display:flex;align-items:center;gap:6px}
  input[type=range]{accent-color:var(--gold);width:120px}
  input[type=text]{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);padding:7px 9px;width:150px}
  select{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);padding:6px}
  button{font:inherit;font-size:13px;color:var(--bone);background:var(--panel);border:1px solid var(--line);padding:9px 12px;cursor:pointer;line-height:1}
  button:hover{border-color:var(--line-hard)}
  button.primary{background:var(--bone);color:#141a1d;border-color:var(--bone)}
  .views{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .views figure{margin:0}
  .views figcaption{color:var(--muted);font-size:12px;margin-top:6px}
  canvas{display:block;image-rendering:pixelated;background:var(--panel)}
  .verdict{font-size:13.5px;color:var(--clue);margin:14px 0;line-height:1.6}
  .verdict strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:19px;color:var(--gold);display:block}
  pre{background:var(--panel);border:1px solid var(--line);padding:10px;font-size:12px;overflow:auto;color:var(--clue)}
  .saved{list-style:none;padding:0;margin:8px 0;font-size:13px}
  .saved li{display:flex;gap:10px;align-items:center;padding:4px 0}
  .saved button{padding:5px 8px;font-size:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Make a puzzle</h1>
  <p class="tag">from a picture · back to <a href="index.html">the game</a></p>

  <label class="drop" id="drop">
    Drop a picture here, or tap to choose one.<br>
    Silhouettes, icons and bold shapes on a plain background work best.
    <input type="file" id="file" accept="image/*" hidden>
  </label>

  <div id="work" hidden>
    <div class="controls">
      <label>Size
        <select id="size">
          <option>5</option><option>10</option><option selected>15</option><option>20</option>
        </select>
      </label>
      <label>Threshold <input type="range" id="thr" min="0" max="255"></label>
      <label><input type="checkbox" id="invert"> Invert</label>
      <label><input type="checkbox" id="repair" checked> Make solvable</label>
    </div>

    <div class="views">
      <figure><canvas id="srcView"></canvas><figcaption>cropped picture</figcaption></figure>
      <figure><canvas id="grayView"></canvas><figcaption>shrunk</figcaption></figure>
      <figure><canvas id="outView"></canvas><figcaption>puzzle · <span style="color:var(--gold)">gold</span> = changed to make it solvable</figcaption></figure>
    </div>

    <div class="verdict" id="verdict"></div>

    <div class="controls">
      <input type="text" id="name" placeholder="Name it">
      <button class="primary" id="play">Add to the game</button>
      <button id="copy">Copy as code</button>
    </div>
    <pre id="code"></pre>
  </div>

  <div id="savedBox" hidden>
    <p class="tag" style="margin:24px 0 0">Your puzzles</p>
    <ul class="saved" id="saved"></ul>
  </div>
</div>

<script src="picture.js"></script>
<script>
const { shrink, otsu, toGrid, makeSolvable, solve, cluesOf, unknowns, quality, rowsOf } = Nonogram;
const el = id => document.getElementById(id);
let img = null;

function readPixels(image, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);      // transparent PNGs go on white
  x.drawImage(image, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h);
  for (let p = 0; p < w * h; p++) lum[p] = 0.299 * d[p * 4] + 0.587 * d[p * 4 + 1] + 0.114 * d[p * 4 + 2];
  return lum;
}

let shrunk = null;   // { N, gray[][], bg, best }

function prepare() {
  const N = +el("size").value;
  const W = 400, H = Math.round(400 * img.height / img.width);
  const lum = readPixels(img, W, H);
  const { gray, bg, square } = shrink(lum, W, H, N);
  const [sx, sy, side] = square;
  // the score is for the starting settings, so work it out before they can move
  const best = quality(gray, bg, { lum, w: W, h: H, square });
  shrunk = { N, gray, bg, best };

  const sv = el("srcView"); sv.width = sv.height = 180;
  const sc = sv.getContext("2d");
  sc.fillStyle = "#fff"; sc.fillRect(0, 0, 180, 180);
  const k = img.width / W;
  sc.drawImage(img, sx * k, sy * k, side * k, side * k, 0, 0, 180, 180);

  el("thr").value = best.thr;
  el("invert").checked = best.invert;
  render();
}

function render() {
  const { N, gray, best } = shrunk;
  const thr = +el("thr").value, inv = el("invert").checked;
  const T0 = toGrid(gray, thr, inv);
  const res = el("repair").checked ? makeSolvable(T0, gray, thr) : { T: T0, flipped: new Set(), solved: unknowns(solve(...cluesOf(T0))) === 0 };
  shrunk.T = res.T;

  const s = Math.floor(180 / N);
  const gv = el("grayView"); gv.width = gv.height = s * N;
  const gc = gv.getContext("2d");
  gray.forEach((r, i) => r.forEach((v, j) => { gc.fillStyle = `rgb(${v},${v},${v})`; gc.fillRect(j * s, i * s, s, s); }));

  const ov = el("outView"); ov.width = ov.height = s * N;
  const oc = ov.getContext("2d");
  oc.fillStyle = "#1b2326"; oc.fillRect(0, 0, s * N, s * N);
  res.T.forEach((r, i) => r.forEach((v, j) => {
    const changed = res.flipped.has(i + "," + j);
    if (v) { oc.fillStyle = changed ? "#e8b54b" : "#e9e3d6"; oc.fillRect(j * s, i * s, s, s); }
    else if (changed) { oc.strokeStyle = "#e8b54b"; oc.lineWidth = 2; oc.strokeRect(j * s + 2, i * s + 2, s - 4, s - 4); }
  }));

  const filled = res.T.flat().filter(v => v).length / (N * N);
  let say;
  if (!res.solved) say = `<strong>Not solvable yet</strong>It needs guessing to finish. Turn on “Make solvable”, or try another threshold.`;
  else if (filled < 0.15 || filled > 0.85) say = `<strong>Solvable, but thin</strong>${Math.round(filled * 100)}% filled — try the threshold or Invert.`;
  else say = `<strong>Solvable</strong>One answer, no guessing. ${Math.round(filled * 100)}% filled` +
    (res.flipped.size ? `, ${res.flipped.size} square${res.flipped.size > 1 ? "s" : ""} changed from the picture.` : `, nothing changed from the picture.`);
  const pc = x => Math.round(100 * x);
  say += `<br><span style="color:var(--muted)">Picture quality at ${N}×${N}: <b style="color:var(--bone)">${best.score}</b> — ` +
    `shape ${pc(best.shape)} · clarity ${pc(best.clarity)} · clean ${pc(best.clean)} · faithful ${pc(best.faithful)} · balance ${pc(best.balance)} · interest ${pc(best.interest)}</span>`;
  el("verdict").innerHTML = say;
  shrunk.solved = res.solved;
  el("code").textContent = code();
}

function puzzleName() { return el("name").value.trim() || "My picture"; }
function code() {
  const rows = shrunk.T.map(r => r.map(v => v ? "#" : ".").join(""));
  return `  { name:${JSON.stringify(puzzleName())}, rows:[\n` + rows.map(r => `    "${r}"`).join(",\n") + `\n  ]},`;
}

/* ---- saved puzzles, shared with the game through localStorage ---- */
const KEY = "nonogram:custom";
const loadSaved = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
function drawSaved() {
  const list = loadSaved();
  el("savedBox").hidden = !list.length;
  el("saved").innerHTML = "";
  list.forEach((p, k) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${p.name.replace(/</g, "&lt;")} <span style="color:var(--muted)">${p.rows.length}×${p.rows.length}</span></span>`;
    const del = document.createElement("button");
    del.textContent = "Remove";
    del.onclick = () => { const l = loadSaved(); l.splice(k, 1); localStorage.setItem(KEY, JSON.stringify(l)); drawSaved(); };
    li.appendChild(del);
    el("saved").appendChild(li);
  });
}

el("play").onclick = () => {
  if (!shrunk.solved && !confirm("This one needs guessing to finish. Add it anyway?")) return;
  const list = loadSaved().filter(p => p.name !== puzzleName());
  list.push({ name: puzzleName(), rows: shrunk.T.map(r => r.map(v => v ? "#" : ".").join("")) });
  localStorage.setItem(KEY, JSON.stringify(list));
  // a remade puzzle with the same name starts fresh
  for (const k of ["nonogram:progress", "nonogram:records"]) {
    try { const o = JSON.parse(localStorage.getItem(k)); if (o) { delete o[puzzleName()]; localStorage.setItem(k, JSON.stringify(o)); } } catch (e) {}
  }
  location.href = "index.html#" + encodeURIComponent(puzzleName());
};
el("copy").onclick = () => navigator.clipboard.writeText(code()).then(() => { el("copy").textContent = "Copied"; setTimeout(() => el("copy").textContent = "Copy as code", 1200); });

function open(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    el("name").value = file.name.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");
    el("work").hidden = false;
    prepare();
  };
  im.src = url;
}
el("file").onchange = e => open(e.target.files[0]);
const drop = el("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); open(e.dataTransfer.files[0]); });

el("size").onchange = () => img && prepare();
el("thr").oninput = () => shrunk && render();
el("invert").onchange = () => shrunk && render();
el("repair").onchange = () => shrunk && render();
el("name").oninput = () => shrunk && (el("code").textContent = code());
drawSaved();
</script>
</body>
</html>
